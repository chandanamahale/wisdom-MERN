<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <label for="nameinput">enter your name: </label>
      <input type="text" id="nameinput" placeholder="enter your name" />
      <br />
      <br />
      <label for="ageinput">enter your age:</label>
      <input type="number" id="ageinput" value="100" />
      <br />
      <br />
      <label for="Birthinput">Birth date</label>
      <input type="date" id="Birthinput" />
      <br />
      <br />
      <label for="appointmentinput">appointment</label>
      <input type="datetime" id="appointmentinput" />
      <br />
      <br />
      <label for="fileinput">upload file</label>
      <input type="file" id="fileinput" />
      <br />
      <br />
      <label for="emailinput">email</label>
      <input type="email"id="emailinput"name="email">
      <label for="checkboxinput"></label>
      <br />
      <br />
      <label for="">password</label>
      <input type="password" />
      <br />
      <br />
      <label for="">contact number</label>
      <input type="text" pattern="\+91-[9876][0-9]{9}]\" />
      <br />
      <br />
      <!-- <label for="">submit</label> -->
      <input type="submit">
      <input type="button" value="click">
      <br>
      <br>
      <input type="range" value="3">
      <br>
      <input type="checkbox" value="python">python
      <input type="checkbox" value="java">java
      <input type="checkbox" value="sql">sql
      <br>
      <br>
      <input type="radio" value="male">male
      <br>
      <input type="radio" value="female">female

    </form>
  </body>
</html>
