
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisdom Sprouts Navbar</title>
    
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
}

.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: white;
    padding: 15px 40px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

/* Logo */
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #173b65;
    font-size: 22px;
    font-weight: bold;
}

.logo-icon {
    background-color: #f5a623;
    color: white;
    padding: 8px 12px;
    border-radius: 5px;
}

/* Search box */
.search-box input {
    width: 220px;
    padding: 10px 15px;
    border: 1px solid #ccc;
    border-radius: 20px;
    outline: none;
}

/* Navigation links */
.nav-links {
    display: flex;
    align-items: center;
    gap: 25px;
    list-style: none;
}

.nav-links a {
    text-decoration: none;
    color: #333;
    font-size: 15px;
}

.nav-links a:hover {
    color: #f5a623;
}

/* Login button */
.login-btn {
    background-color: #f5a623;
    color: white;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: 14px;
}

.login-btn:hover {
    background-color: #d98b0b;
}

/* Responsive design */
@media (max-width: 900px) {
    .navbar {
        flex-wrap: wrap;
        gap: 15px;
        padding: 15px 20px;
    }

    .nav-links {
        gap: 15px;
        flex-wrap: wrap;
    }
}

@media (max-width: 600px) {
    .navbar {
        flex-direction: column;
    }

    .search-box input {
        width: 250px;
    }

    .nav-links {
        justify-content: center;
    }
}

    </style>
</head>
<body>

    <nav class="navbar">

        <div class="logo">
            <span class="logo-icon">W</span>
            <span>Wisdom Sprouts</span>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search courses, training...">
        </div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Internship</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <a href="#" class="login-btn">Login</a>

    </nav>

</body>
</html>
