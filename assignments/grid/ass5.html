<!DOCTYPE html>
<html>
<head>
    <title>Basic CSS Grid Layout</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 20px;
            background-color: #f2f2f2;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 80px 60px 250px 70px;
            gap: 8px;
            padding: 10px;
            border: 5px solid black;
            max-width: 600px;
            margin: auto;
        }

        .container div {
            border: 3px solid navy;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: darkgreen;
        }

        .header {
            grid-column: 1 / 4;
        }

        .nav {
            grid-column: 1 / 4;
        }

        .left {
            grid-column: 1;
        }

        .main {
            grid-column: 2;
        }

        .right {
            grid-column: 3;
        }

        .footer {
            grid-column: 1 / 4;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">Header</div>

        <div class="nav">Navigation Menu</div>

        <div class="left">Content</div>

        <div class="main">Main Content</div>

        <div class="right">Content</div>

        <div class="footer">Footer</div>

    </div>

</body>
</html>
