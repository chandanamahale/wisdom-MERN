<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Blog Layout</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #eeeeee;
            font-family: Arial;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 200px 200px 100px;
            gap: 10px;
            max-width: 1000px;
            margin: auto;
        }

        .item {
            background-size: cover;
            background-position: center;
            position: relative;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            box-sizing: border-box;
        }

        .item p {
            background: rgba(0,0,0,0.4);
            padding: 8px;
            display: inline-block;
        }

        .one {
            background-image: url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=600");
        }

        .two {
            grid-column: 2 / 4;
            background-image: url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=900");
        }

        .three {
            grid-column: 1 / 3;
            background-image: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900");
        }

        .four {
            background-image: url("https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=600");
        }

        .five {
            background-image: url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600");
        }

        .six {
            background-image: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600");
        }

        .seven {
            background-image: url("https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600");
        }

        @media(max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: repeat(4, 160px);
            }

            .item {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <h2 style="text-align:center;">My Blog Gallery</h2>

    <div class="gallery">

        <div class="item one">
            <p>The wonder of my content</p>
        </div>

        <div class="item two">
            <p>Instagram is toxic but I keep posting</p>
        </div>

        <div class="item three">
            <p>Throwing my phone into the ocean</p>
        </div>

        <div class="item four">
            <p>I'm never going back</p>
        </div>

        <div class="item five">
            <p>Staring at the horizon</p>
        </div>

        <div class="item six">
            <p>This is nature</p>
        </div>

        <div class="item seven">
            <p>Take time and enjoy</p>
        </div>

    </div>

</body>
</html>
