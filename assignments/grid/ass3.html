<!DOCTYPE html>
<html>
<head>
<title>Responsive Gallery</title>
<style>
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
}

.card {
    background: #f2f2f2;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 8px;
}

.card h3 {
    color: darkblue;
}

.card p {
    font-size: 14px;
}
</style>
</head>
<body>

<h2>Beautiful Places Gallery</h2>

<div class="gallery">

<div class="card">
    <img src="https://picsum.photos/id/1015/400/300">
    <h3>Mountains</h3>
    <p>Beautiful mountain landscapes.</p>
</div>

<div class="card">
    <img src="https://picsum.photos/id/1016/400/300">
    <h3>Nature</h3>
    <p>Explore green natural beauty.</p>
</div>

<div class="card">
    <img src="https://picsum.photos/id/1018/400/300">
    <h3>Forest</h3>
    <p>Peaceful forest environment.</p>
</div>

<div class="card">
    <img src="https://picsum.photos/id/1020/400/300">
    <h3>Wildlife</h3>
    <p>Discover beautiful wildlife.</p>
</div>

<div class="card">
    <img src="https://picsum.photos/id/1024/400/300">
    <h3>Animals</h3>
    <p>Different animal species.</p>
</div>

<div class="card">
    <img src="https://picsum.photos/id/1035/400/300">
    <h3>Adventure</h3>
    <p>Enjoy outdoor adventures.</p>
</div>

</div>

</body>
</html>
