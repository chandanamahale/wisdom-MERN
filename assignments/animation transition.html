<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation transition</title>
</head>
<style>
    .animated-box {
        width: 100px;
        height: 100px;
        background-color: blue;
        transition: all 0.5s ease;
    }

    .animated-box:hover {
        background-color: red;
        transform: scale(1.2);
    }
    @keyframes pulse {
        0% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.2);
        }
        100% {
            transform: scale(1);
        }
    }
</style>
<body>
    <div class="animated-box">

    </div>
</body>
</html>
