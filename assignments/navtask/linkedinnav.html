
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Navbar</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f3f2ef;
}

.navbar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background-color: white;
    padding: 10px 30px;
    border-bottom: 1px solid #ddd;
}

.left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo {
    background-color: #0a66c2;
    color: white;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 30px;
}

.left input {
    padding: 10px;
    border: none;
    border-radius: 5px;
    background-color: #edf3f8;
    width: 250px;
}

.right {
    display: flex;
    align-items: center;
    gap: 25px;
}

.right a {
    text-decoration: none;
    color: #666;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 22px;
}

.right a span {
    font-size: 12px;
    margin-top: 4px;
}

.right a:hover {
    color: black;
}

@media (max-width: 768px) {
    .navbar {
        flex-wrap: wrap;
        gap: 15px;
    }

    .right {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .left input {
        width: 150px;
    }
}
</style>
<body>

    <nav class="navbar">

        <div class="left">
            <h1 class="logo">in</h1>
            <input type="text" placeholder="Search">
        </div>

        <div class="right">
            <a href="#">⌂<span>Home</span></a>
            <a href="#">♙<span>My Network</span></a>
            <a href="#">▣<span>Jobs</span></a>
            <a href="#">✉<span>Messaging</span></a>
            <a href="#">♧<span>Notifications</span></a>
            <a href="#">👤<span>Me</span></a>
        </div>

    </nav>

</body>
</html>
