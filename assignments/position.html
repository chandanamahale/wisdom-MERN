
<!DOCTYPE html>
<html>
<head>
    <title>CSS Position</title>

</head>
<style>
    
.box {
    width: 150px;
    height: 100px;
    margin: 20px;
    padding: 10px;
    color: white;
}

.box1 {
    background-color: red;
    position: static;
}

.box2 {
    background-color: blue;
    position: relative;
    left: 30px;
}

.box3 {
    background-color: green;
    position: absolute;
    top: 50px;
    right: 20px;
}

.box4 {
    background-color: purple;
    position: fixed;
    bottom: 10px;
    right: 10px;
}

.box5 {
    background-color: orange;
    position: sticky;
    top: 0;
}
.div1
{
   height: 50px;
   width: 50px;
}

</style>
<body>

    <div class="box box1">Box 1 - Static</div>
    <div class="box box2">Box 2 - Relative</div>
    <div class="box box3">Box 3 - Absolute</div>
    <div class="box box4">Box 4 - Fixed</div>
    <div class="box box5">Box 5 - Sticky</div>

<br>
<br>
<br>
    <br>
    <br>
    <div class="div1">
        <img src="./assets/position.jpg">
         <p> with great design comes great response </p>
        
    </div>

</body>
</html>
